<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>
        <form action="">
            <div class="card">
                <h2 class="card-title">Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>
                    <div class="form-group">
                        <label for="middle_name">Middle Name</label>
                        <input type="text" id="middle_name" name="middle_name">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="lastname" name="lastname">
                    </div>
                    <div class="form-group">
                        <label for="first_name_amharic">First Name (Amharic)</label>
                        <input type="text" id="first_name_amharic" name="first_name_amharic">
                    </div>
                    <div class="form-group">
                        <label for="middle_name_amharic">Middle Name (Amharic)</label>
                        <input type="text" id="middle_name_amharic" name="middle_name_amharic">
                    </div>
                    <div class="form-group">
                        <label for="last_name_amharic">Last Name (Amharic)</label>
                        <input type="text" id="last_name_amharic" name="last_name_amharic">
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="birthdate">Birthdate</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>
                    <div class="form-group">
                        <label for="profile_picture">Profile Picture</label>    
                        <input type="file" id="profile_picture" name="profile_picture">
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Contact Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="identity_type">Identity Type</label>
                        <select name="identity_type" id="identity_type">
                            <option value="national_id">National ID</option>
                            <option value="passport">Passport</option>
                            <option value="driver_license">Driver License</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="id_number">Identity Number</label>
                        <input type="text" id="id_number" name="id_number">
                    </div>
                    <div class="form-group">
                        <label for="issued_date">Issued Date</label>
                        <input type="date" id="issued_date" name="issued_date">
                    </div>
                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input type="date" id="expiry_date" name="expiry_date">
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" name="country">
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city">
                    </div>
                    <div class="form-group">
                        <label for="state">Woreda</label>
                        <input type="text" id="woreda" name="woreda">
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address">
                    </div>
                    <div class="form-group">
                        <label for="zip_code">Zip Code</label>
                        <input type="text" id="zip_code" name="zip_code">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="bank_name">Bank Name</label>
                        <input type="text" id="bank_name" name="bank_name">
                    </div>
                    <div class="form-group">
                        <label for="account_number">Account Number</label>
                        <input type="text" id="account_number" name="account_number">
                    </div>
                </div>
            </div>
        </form>
        
        <button type="submit" class="submit-btn">Submit Registration</button>
    </div>
</body>
</html>
