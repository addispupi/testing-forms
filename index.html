<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Registration Form</h1>
        <form action="">
            <div class="card">
                <h2 class="card-title">Personal Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>
                    <div class="form-group">
                        <label for="middle_name">Middle Name</label>
                        <input type="text" id="middle_name" name="middle_name">
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>
                    <div class="form-group">
                        <label for="first_name_amharic">First Name (Amharic)</label>
                        <input type="text" id="first_name_amharic" name="first_name_amharic">
                    </div>
                    <div class="form-group">
                        <label for="middle_name_amharic">Middle Name (Amharic)</label>
                        <input type="text" id="middle_name_amharic" name="middle_name_amharic">
                    </div>
                    <div class="form-group">
                        <label for="last_name_amharic">Last Name (Amharic)</label>
                        <input type="text" id="last_name_amharic" name="last_name_amharic">
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select name="gender" id="gender">
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="birthdate">Birthdate</label>
                        <input type="date" id="birthdate" name="birthdate">
                    </div>
                    <div class="form-group">
                        <label for="profile_picture">Profile Picture</label>    
                        <input type="file" id="profile_picture" name="profile_picture">
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Password</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                    </div>
                    <button type="button" id="generate_password" class="submit-btn">Generate Password</button>
                </div>
            </div>

            <div class="card">
                <h2>Contact Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="identity_type">Identity Type</label>
                        <select name="identity_type" id="identity_type">
                            <option value="national_id">National ID</option>
                            <option value="passport">Passport</option>
                            <option value="driver_license">Driver License</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="id_number">Identity Number</label>
                        <input type="text" id="id_number" name="id_number">
                    </div>
                    <div class="form-group">
                        <label for="issued_date">Issued Date</label>
                        <input type="date" id="issued_date" name="issued_date">
                    </div>
                    <div class="form-group">
                        <label for="expiry_date">Expiry Date</label>
                        <input type="date" id="expiry_date" name="expiry_date">
                    </div>
                    <div class="form-group">
                        <label for="country">Country</label>
                        <input type="text" id="country" name="country">
                    </div>
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" id="city" name="city">
                    </div>
                    <div class="form-group">
                        <label for="woreda">Woreda</label>
                        <input type="text" id="woreda" name="woreda">
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" name="address">
                    </div>
                    <div class="form-group">
                        <label for="zip_code">Zip Code</label>
                        <input type="text" id="zip_code" name="zip_code">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="bank_name">Bank Name</label>
                        <input type="text" id="bank_name" name="bank_name">
                    </div>
                    <div class="form-group">
                        <label for="account_number">Account Number</label>
                        <input type="text" id="account_number" name="account_number">
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Educational Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="highest_education">Highest Education</label>
                        <input type="text" id="highest_education" name="highest_education">
                    </div>
                </div>

                <h2>Work Experience</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="company_name">Company Name</label>
                        <input type="text" id="company_name" name="company_name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="position">Position</label>
                    <input type="text" id="position" name="position">
                </div>
                <div class="form-group">
                    <label for="start_date">Start Date</label>
                    <input type="date" id="start_date" name="start_date">
                </div>
                <div class="form-group">
                    <label for="end_date">End Date</label>
                    <input type="date" id="end_date" name="end_date">
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description"></textarea>
                </div>

                <h2>Credentials</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="credentials">Credentials</label>
                        <input type="file" id="credentials" name="credentials">
                    </div>
                </div>
                <div class="form-group">
                    <label for="credentials_description">Credentials Description</label>
                    <textarea id="credentials_description" name="credentials_description"></textarea>
                </div>

                <h2>Authentication Information</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="authentication_type">Authentication Type</label>
                        <input type="text" id="authentication_type" name="authentication_type">
                    </div>
                </div>
                <div class="form-group">
                    <label for="authentication_description">Authentication Description</label>
                    <textarea id="authentication_description" name="authentication_description"></textarea>
                </div>
                <div class="form-group">
                    <label for="authentication_date">Authentication Date</label>
                    <input type="date" id="authentication_date" name="authentication_date">
                </div>
                <div class="form-group">
                    <label for="authentication_time">Authentication Time</label>
                    <input type="time" id="authentication_time" name="authentication_time">
                </div>
                <div class="form-group">
                    <label for="authentication_location">Authentication Location</label>
                    <input type="text" id="authentication_location" name="authentication_location">
                </div>
                <div class="form-group">
                    <label for="authentication_ip">Authentication IP</label>
                    <input type="text" id="authentication_ip" name="authentication_ip">
                </div>
            </div>
        </form>
        
        <button type="submit" class="submit-btn">Submit Registration</button>
    </div>
</body>
</html>
